<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piscipedia AIEEA PG Rank Predictor</title><style>
body{font-family:Arial;margin:0;background:#f3f7f6;color:#15352f}.hero{background:#073b35;color:white;padding:38px 20px;text-align:center}.card{max-width:680px;margin:25px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0002}label{display:block;margin-top:14px;font-weight:bold}input,select{width:100%;padding:13px;margin-top:6px;border:1px solid #ccd8d5;border-radius:8px;box-sizing:border-box}button{width:100%;padding:16px;background:#087364;color:white;border:0;border-radius:9px;font-size:17px;font-weight:bold;margin-top:22px}.note{background:#fff4d6;padding:12px;border-radius:8px;margin:15px 0}#result{display:none;text-align:center;margin-top:22px;padding:22px;background:#e7f5f1;border-radius:12px}.rank{font-size:34px;font-weight:bold;color:#087364}
</style></head><body><div class="hero"><h1>🐟 PISCIPEDIA</h1><p>ICAR AIEEA PG Fisheries 2026 Rank Predictor</p></div><div class="card">
<div class="note"><b>Unofficial prediction:</b> Based on the Piscipedia historical dataset and continuously updated candidate responses. No scorecard upload is required.</div>
<form id="f"><label>Full Name</label><input name="name" required><label>Domicile State</label><input name="domicile" required><label>Application Number</label><input name="application_no" required><label>Category</label><select name="category" required><option value="">Select</option><option>UR</option><option>EWS</option><option>OBC-NCL</option><option>SC</option><option>ST</option><option>PWD</option></select><label>AIEEA PG Score (Out of 480)</label><input type="number" name="score" min="0" max="480" step=".01" required><button>🔮 PREDICT MY RANK</button></form>
<div id="result"><div>ESTIMATED ALL INDIA RANK</div><div class="rank" id="air"></div><p id="range"></p><small id="size"></small></div></div>
<script>
f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let b=f.querySelector("button");b.disabled=true;b.textContent="Analyzing...";try{let r=await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});let x=await r.json();if(!r.ok)throw Error(x.error);air.textContent="AIR "+x.predicted_air;range.innerHTML="Likely range: <b>"+x.low+" – "+x.high+"</b>";size.textContent="Prediction dataset currently uses "+x.dataset_size+" score observations.";result.style.display="block";result.scrollIntoView({behavior:"smooth"})}catch(err){alert(err.message)}finally{b.disabled=false;b.textContent="🔮 PREDICT MY RANK"}};
</script></body></html>
